version: 2

project_name: slackcli

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: slackcli
    env:
      # cgo links Security.framework so release binaries own their keychain
      # items (internal/keychain/framework_darwin.go). Both archs build with
      # the macOS runner's clang; goarch selects the -arch flag.
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/cgrossde/slackcli/cmd.version={{.Version}}
      # Team that signs releases; enables binary-bound keychain items. Empty in snapshots.
      - -X github.com/cgrossde/slackcli/internal/keychain.teamID={{ envOrDefault "MACOS_TEAM_ID" "" }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*

notarize:
  macos:
    # Mandatory for releases: missing or empty secrets fail the build.
    # Local snapshot builds (goreleaser build --snapshot) skip signing.
    - enabled: '{{ not .IsSnapshot }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

release:
  github:
    owner: cgrossde
    name: slackcli
  draft: false
  make_latest: true

homebrew_casks:
  - name: slackcli
    binaries:
      - slackcli
    repository:
      owner: cgrossde
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/cgrossde/slackcli"
    description: "Slack CLI optimized for usage by LLMs or in scripts"
    license: "MIT"
    completions:
      bash: completions/slackcli.bash
      zsh: completions/slackcli.zsh
      fish: completions/slackcli.fish

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
