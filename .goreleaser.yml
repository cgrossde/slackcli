version: 2

project_name: slackcli

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: slackcli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/cgrossde/slackcli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*

# Signing is mandatory: `enabled` defaults to false, so it is set explicitly.
# Missing secrets render empty values and fail the release instead of
# publishing unsigned binaries.
notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

release:
  github:
    owner: cgrossde
    name: slackcli
  draft: false
  make_latest: true

homebrew_casks:
  - name: slackcli
    binaries:
      - slackcli
    repository:
      owner: cgrossde
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/cgrossde/slackcli"
    description: "Slack CLI optimized for usage by LLMs or in scripts"
    license: "MIT"
    completions:
      bash: completions/slackcli.bash
      zsh: completions/slackcli.zsh
      fish: completions/slackcli.fish

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
